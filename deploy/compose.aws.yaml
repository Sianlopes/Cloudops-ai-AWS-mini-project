services:
  api:
    image: ${CLOUDOPS_IMAGE:?Set CLOUDOPS_IMAGE to an immutable ECR image tag}
    environment: &aws_env
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      TRUST_PROXY: 1
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SSM_PARAMETER_PATH: /cloudops/prod/
      DB_SSL: "true"
      DB_CA_FILE: /app/certs/global-bundle.pem
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "4000:4000"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: /cloudops/application
        awslogs-stream: ${INSTANCE_LABEL:?Set INSTANCE_LABEL to a unique instance label}-api
  worker:
    image: ${CLOUDOPS_IMAGE}
    command: ["node", "server/worker.js"]
    environment: *aws_env
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: /cloudops/application
        awslogs-stream: ${INSTANCE_LABEL}-worker
