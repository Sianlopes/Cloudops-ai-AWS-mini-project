services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: cloudops
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment: &app_env
      NODE_ENV: development
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://cloudops:${POSTGRES_PASSWORD}@database:5432/cloudops
      APP_ORIGIN: http://127.0.0.1:4000
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "server/worker.js"]
    environment: *app_env
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
